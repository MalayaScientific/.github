name: Pi Auth

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target Malaya Scientific repository
        required: true
        type: string
      issue_number:
        description: Implementation Issue number
        required: true
        type: string
      comment_id:
        description: Human @pi authorization comment ID
        required: true
        type: string

permissions: {}

concurrency:
  group: pi-chatgpt-auth
  queue: max

jobs:
  authorize:
    name: Authorize Pi execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pi-auth

    env:
      ORG: MalayaScientific
      TARGET_REPOSITORY: ${{ inputs.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      COMMENT_ID: ${{ inputs.comment_id }}

    steps:
      - name: Configure Pi auth directory
        shell: bash
        run: |
          set -euo pipefail

          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-auth" >> "$GITHUB_ENV"

      - name: Validate input shape
        shell: bash
        run: |
          set -euo pipefail

          [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$COMMENT_ID" =~ ^[0-9]+$ ]]

      - name: Mint Nyonya Pi control token
        id: control
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.NYONYA_PI_CLIENT_ID }}
          private-key: ${{ secrets.NYONYA_PI_PRIVATE_KEY }}
          owner: MalayaScientific
          repositories: |
            .github
            ${{ inputs.repository }}
          permission-environments: write
          permission-issues: write
          permission-secrets: write

      - name: Validate human authorization
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.control.outputs.token }}
          AUTHORIZED_USERS: ${{ vars.PI_AUTHORIZED_GITHUB_LOGINS }}
          BOT_LOGIN: ${{ vars.NYONYA_PI_BOT_LOGIN }}
        run: |
          set -euo pipefail

          issue="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$ORG/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER"
          )"

          comment="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$ORG/$TARGET_REPOSITORY/issues/comments/$COMMENT_ID"
          )"

          fields="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$ORG/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values"
          )"

          # The authorization subject must still be an open Implementation Issue.
          jq -e '
            .state == "open"
            and ((.pull_request // null) == null)
            and ((.type.name // "") == "Implementation")
          ' <<<"$issue" >/dev/null

          field_value() {
            jq -er \
              --arg name "$1" '
                [
                  .[]
                  | select(.issue_field_name == $name)
                  | .single_select_option.name
                ]
                | if length == 0 then
                    ""
                  elif length == 1 then
                    .[0]
                  else
                    error("duplicate Issue field")
                  end
              ' <<<"$fields"
          }

          publication="$(field_value "Publication")"
          scope="$(field_value "Scope")"
          proof="$(field_value "Proof")"

          case "$publication" in
            "Direct"|"Pull request")
              ;;
            *)
              echo "::error::Publication must be Direct or Pull request."
              exit 1
              ;;
          esac

          case "$scope" in
            ""|"Frontend")
              ;;
            *)
              echo "::error::Scope must be blank or Frontend."
              exit 1
              ;;
          esac

          case "$proof" in
            ""|"Screenshot")
              ;;
            *)
              echo "::error::Proof must be blank or Screenshot."
              exit 1
              ;;
          esac

          # The supplied comment must belong to this Issue.
          expected_issue_url="https://api.github.com/repos/$ORG/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER"
          actual_issue_url="$(jq -r '.issue_url' <<<"$comment")"

          [[ "$actual_issue_url" == "$expected_issue_url" ]]

          author="$(jq -r '.user.login' <<<"$comment")"
          author_type="$(jq -r '.user.type' <<<"$comment")"
          body="$(jq -r '.body // ""' <<<"$comment")"

          # Automation and bots cannot manufacture implementation authority.
          [[ "$author_type" == "User" ]]

          printf '%s' "$body" |
            grep -Eiq '(^|[^[:alnum:]_])@pi([^[:alnum:]_]|$)'

          author_lower="$(
            printf '%s' "$author" |
              tr '[:upper:]' '[:lower:]'
          )"

          allowed="$(
            printf '%s' "$AUTHORIZED_USERS" |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]'
          )"

          case ",$allowed," in
            *",$author_lower,"*)
              ;;
            *)
              echo "::error::@$author is not authorized to delegate Pi execution."
              exit 1
              ;;
          esac

          # A retry of the same central request must not create another execution
          # handoff for the same human authorization comment.
          marker="<!-- nyonya-pi:authorization:$COMMENT_ID -->"

          existing="$(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$ORG/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER/comments" |
              jq -r \
                --arg bot "$BOT_LOGIN" \
                --arg marker "$marker" '
                  .[]
                  | select(
                      .user.login == $bot
                      and ((.body // "") | contains($marker))
                    )
                  | .id
                ' |
              head -n 1
          )"

          if [[ -n "$existing" ]]; then
            echo "Authorization comment already produced an execution handoff."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.request.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2

      - name: Install Pi
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          npm install -g --ignore-scripts \
            @earendil-works/pi-coding-agent@1.6.0

      - name: Hydrate renewable Pi auth
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH }}
        run: |
          set -euo pipefail

          if [[ -z "$PI_AUTH_JSON" ]]; then
            echo "::error::PI_AUTH is empty or unavailable."
            exit 1
          fi

          install -d -m 700 "$PI_CODING_AGENT_DIR"

          printf '%s' "$PI_AUTH_JSON" \
            > "$PI_CODING_AGENT_DIR/auth.json"

          chmod 600 "$PI_CODING_AGENT_DIR/auth.json"

          jq -e '
            .openai.type == "oauth"
            and (.openai.access | type == "string")
            and (.openai.refresh | type == "string")
            and (.openai.expires | type == "number")
          ' "$PI_CODING_AGENT_DIR/auth.json" >/dev/null

          cp \
            "$PI_CODING_AGENT_DIR/auth.json" \
            "$PI_CODING_AGENT_DIR/auth.before.json"

      - name: Resolve fresh ChatGPT execution token
        if: steps.request.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          token="$(
            pi auth print-bearer-token \
              --provider openai \
              --min-expiry 50m
          )"

          if [[ -z "$token" ]]; then
            echo "::error::Pi returned an empty ChatGPT bearer token."
            exit 1
          fi

          echo "::add-mask::$token"

          printf '%s' "$token" \
            > "$RUNNER_TEMP/pi-chatgpt-token"

          chmod 600 "$RUNNER_TEMP/pi-chatgpt-token"

      - name: Persist rotated PI_AUTH
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.control.outputs.token }}
        run: |
          set -euo pipefail

          if ! cmp -s \
            "$PI_CODING_AGENT_DIR/auth.before.json" \
            "$PI_CODING_AGENT_DIR/auth.json"
          then
            echo "Pi rotated renewable ChatGPT authentication state."

            gh secret set PI_AUTH \
              --repo MalayaScientific/.github \
              --env pi-auth \
              < "$PI_CODING_AGENT_DIR/auth.json"
          else
            echo "PI_AUTH did not rotate."
          fi

      - name: Publish repository ChatGPT credential
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.control.outputs.token }}
        run: |
          set -euo pipefail

          gh secret set PI_CHATGPT_ACCESS_TOKEN \
            --repo "$ORG/$TARGET_REPOSITORY" \
            < "$RUNNER_TEMP/pi-chatgpt-token"

      - name: Emit execution handoff
        if: steps.request.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.control.outputs.token }}
        run: |
          set -euo pipefail

          comment="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$ORG/$TARGET_REPOSITORY/issues/comments/$COMMENT_ID"
          )"

          author="$(jq -r '.user.login' <<<"$comment")"
          url="$(jq -r '.html_url' <<<"$comment")"
          body="$(jq -r '.body // ""' <<<"$comment")"

          marker="<!-- nyonya-pi:authorization:$COMMENT_ID -->"

          quoted="$(
            printf '%s\n' "$body" |
              sed 's/^/> /'
          )"

          handoff="$(
            printf '%s\n@nyonya-pi\n\nAuthorized by @%s: %s\n\n%s\n' \
              "$marker" \
              "$author" \
              "$url" \
              "$quoted"
          )"

          gh api \
            --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$ORG/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="$handoff"

      - name: Remove local credentials
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${PI_CODING_AGENT_DIR:-}" ]]; then
            rm -rf "$PI_CODING_AGENT_DIR"
          fi

          rm -f "$RUNNER_TEMP/pi-chatgpt-token"
